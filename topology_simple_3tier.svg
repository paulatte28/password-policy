<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 7 L 10 0 z" fill="#3b82f6"/>
    </marker>
    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="840" height="42" rx="8" fill="#0f172a"/>
  <text x="440" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="0.5">3-TIER WEB ARCHITECTURE TOPOLOGY</text>

  <!-- ================= TIER 1: CLIENT TIER ================= -->
  <g transform="translate(20, 75)" filter="url(#shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="840" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="28" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="18" width="840" height="10" fill="#e2e8f0"/>
    <text x="20" y="19" font-size="12" font-weight="800" fill="#334155" letter-spacing="0.5">TIER 1: CLIENT LAYER (WEB BROWSERS)</text>

    <!-- Role 1: Administrator -->
    <g transform="translate(25, 38)">
      <rect x="0" y="0" width="240" height="58" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="28" cy="29" r="14" fill="#dcfce7"/>
      <text x="28" y="34" text-anchor="middle" font-size="14">👤</text>
      <text x="52" y="26" font-size="13" font-weight="700" fill="#0f172a">Administrator</text>
      <text x="52" y="44" font-size="11" fill="#64748b">Manages users &amp; standards</text>
    </g>

    <!-- Role 2: Security Analyst -->
    <g transform="translate(300, 38)">
      <rect x="0" y="0" width="240" height="58" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="28" cy="29" r="14" fill="#e0f2fe"/>
      <text x="28" y="34" text-anchor="middle" font-size="14">🛡️</text>
      <text x="52" y="26" font-size="13" font-weight="700" fill="#0f172a">Security Analyst</text>
      <text x="52" y="44" font-size="11" fill="#64748b">Tests &amp; evaluates policies</text>
    </g>

    <!-- Role 3: Viewer -->
    <g transform="translate(575, 38)">
      <rect x="0" y="0" width="240" height="58" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="28" cy="29" r="14" fill="#f3e8ff"/>
      <text x="28" y="34" text-anchor="middle" font-size="14">👁️</text>
      <text x="52" y="26" font-size="13" font-weight="700" fill="#0f172a">Viewer / Auditor</text>
      <text x="52" y="44" font-size="11" fill="#64748b">Views dashboard &amp; reports</text>
    </g>
  </g>

  <!-- Flow Connector 1 -->
  <line x1="440" y1="185" x2="440" y2="225" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="195" width="220" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="440" y="209" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e40af">HTTP / HTTPS (REST API Requests)</text>

  <!-- ================= TIER 2: APPLICATION TIER ================= -->
  <g transform="translate(20, 230)" filter="url(#shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="840" height="145" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="28" rx="10" fill="#dbeafe"/>
    <rect x="0" y="18" width="840" height="10" fill="#dbeafe"/>
    <text x="20" y="19" font-size="12" font-weight="800" fill="#1e40af" letter-spacing="0.5">TIER 2: APPLICATION LAYER (WEB &amp; API SERVICES)</text>

    <!-- Main App Box -->
    <g transform="translate(25, 38)">
      <rect x="0" y="0" width="790" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Component 1 -->
      <g transform="translate(25, 12)">
        <text x="0" y="18" font-size="13" font-weight="700" fill="#0f172a">React + Vite Frontend</text>
        <text x="0" y="38" font-size="11" fill="#64748b">• Clean, responsive user interface</text>
        <text x="0" y="54" font-size="11" fill="#64748b">• Policy form &amp; JSON/CSV import</text>
        <text x="0" y="70" font-size="11" fill="#64748b">• Chart.js visual score graphs</text>
      </g>

      <!-- Vertical Divider -->
      <line x1="275" y1="12" x2="275" y2="80" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Component 2 -->
      <g transform="translate(300, 12)">
        <text x="0" y="18" font-size="13" font-weight="700" fill="#0f172a">FastAPI Backend Server</text>
        <text x="0" y="38" font-size="11" fill="#64748b">• Runs on Python using Uvicorn</text>
        <text x="0" y="54" font-size="11" fill="#64748b">• Compliance Evaluation Engine</text>
        <text x="0" y="70" font-size="11" fill="#64748b">• Compares against NIST &amp; OWASP</text>
      </g>

      <!-- Vertical Divider -->
      <line x1="550" y1="12" x2="550" y2="80" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Component 3 -->
      <g transform="translate(575, 12)">
        <text x="0" y="18" font-size="13" font-weight="700" fill="#0f172a">Security &amp; Auth Controller</text>
        <text x="0" y="38" font-size="11" fill="#64748b">• JWT token login &amp; user roles</text>
        <text x="0" y="54" font-size="11" fill="#64748b">• BCrypt hashed staff passwords</text>
        <text x="0" y="70" font-size="11" fill="#64748b">• Defensive account lockout logic</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 -->
  <line x1="440" y1="375" x2="440" y2="415" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="385" width="220" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="440" y="399" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e40af">SQLAlchemy ORM (Database Queries)</text>

  <!-- ================= TIER 3: DATA TIER ================= -->
  <g transform="translate(20, 420)" filter="url(#shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="840" height="115" rx="10" fill="#f8fafc" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="28" rx="10" fill="#d1fae5"/>
    <rect x="0" y="18" width="840" height="10" fill="#d1fae5"/>
    <text x="20" y="19" font-size="12" font-weight="800" fill="#065f46" letter-spacing="0.5">TIER 3: DATA STORAGE LAYER (DATABASE PERSISTENCE)</text>

    <!-- DB 1: Local SQLite -->
    <g transform="translate(25, 38)">
      <rect x="0" y="0" width="380" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="28" cy="31" r="14" fill="#e0f2fe"/>
      <text x="28" y="36" text-anchor="middle" font-size="14">💾</text>
      <text x="52" y="24" font-size="13" font-weight="700" fill="#0f172a">SQLite (passwordpolicy.db)</text>
      <text x="52" y="42" font-size="11" fill="#64748b">Local embedded database for offline development &amp; testing</text>
    </g>

    <!-- DB 2: Supabase PostgreSQL -->
    <g transform="translate(435, 38)">
      <rect x="0" y="0" width="380" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="28" cy="31" r="14" fill="#dcfce7"/>
      <text x="28" y="36" text-anchor="middle" font-size="14">🗄️</text>
      <text x="52" y="24" font-size="13" font-weight="700" fill="#0f172a">Supabase PostgreSQL</text>
      <text x="52" y="42" font-size="11" fill="#64748b">Cloud database in production for reports &amp; audit logs</text>
    </g>
  </g>
</svg>
